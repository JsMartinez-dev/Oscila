</button>

<script data-purpose="auth-tabs-and-ui">
    // Alternancia entre pestañas Iniciar Sesión y Registro
    function switchAuthTab(targetTab) {
      const loginTab = document.getElementById('tab-login');
      const registerTab = document.getElementById('tab-register');
      const loginForm = document.getElementById('form-login');
      const registerForm = document.getElementById('form-register');

      if (targetTab === 'login') {
        // Tab Login Activo
        loginTab.className = "py-2 text-sm font-extrabold rounded-lg text-brand-dark bg-white neo-border shadow-brutal-sm transition-all text-center";
        loginTab.setAttribute('aria-selected', 'true');
        
        // Tab Register Inactivo
        registerTab.className = "py-2 text-sm font-bold text-gray-600 hover:text-brand-dark rounded-lg transition-all text-center border-2 border-transparent";
        registerTab.setAttribute('aria-selected', 'false');

        // Mostrar formulario correspondiente
        loginForm.classList.remove('hidden');
        registerForm.classList.add('hidden');
      } else {
        // Tab Register Activo
        registerTab.className = "py-2 text-sm font-extrabold rounded-lg text-brand-dark bg-white neo-border shadow-brutal-sm transition-all text-center";
        registerTab.setAttribute('aria-selected', 'true');

        // Tab Login Inactivo
        loginTab.className = "py-2 text-sm font-bold text-gray-600 hover:text-brand-dark rounded-lg transition-all text-center border-2 border-transparent";
        loginTab.setAttribute('aria-selected', 'false');

        // Mostrar formulario correspondiente
        registerForm.classList.remove('hidden');
        loginForm.classList.add('hidden');
      }
    }

    // Alternar visibilidad de contraseña
    function togglePasswordVisibility(inputId, iconId) {
      const input = document.getElementById(inputId);
      const icon = document.getElementById(iconId);
      
      if (input.type === 'password') {
        input.type = 'text';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M13.875 18.825A10.05 10.05 0 0112 19c-4.478 0-8.268-2.943-9.543-7a9.97 9.97 0 011.563-3.029m5.858.908a3 3 0 114.243 4.243M9.878 9.878l4.242 4.242M9.88 9.88l-3.29-3.29m7.532 7.532l3.29 3.29M3 3l18 18" />
        `;
      } else {
        input.type = 'password';
        icon.innerHTML = `
          <path stroke-linecap="round" stroke-linejoin="round" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
          <path stroke-linecap="round" stroke-linejoin="round" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z" />
        `;
      }
    }
  </script>
